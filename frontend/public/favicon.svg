<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="65%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Branch Line Gradient -->
    <linearGradient id="branchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Secondary Git Branch Line (Upper curve) -->
  <path d="M 34,68 C 34,44 48,34 64,34 L 78,34" 
        fill="none" 
        stroke="url(#branchGrad)" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Upper Branch Node -->
  <circle cx="78" cy="34" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>

  <!-- Glow duplicate of Pulse Wave -->
  <path d="M 22,68 L 38,68 L 47,48 L 56,86 L 68,24 L 79,94 L 88,54 L 95,68 L 106,68" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.45"
        filter="url(#neonGlow)"/>

  <!-- Primary Git Pulse Waveform -->
  <path d="M 22,68 L 38,68 L 47,48 L 56,86 L 68,24 L 79,94 L 88,54 L 95,68 L 106,68" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Left Git Origin Node -->
  <circle cx="22" cy="68" r="6" fill="#6366f1" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Center Peak Pulse Node -->
  <circle cx="68" cy="24" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>

  <!-- Right Git Merge Node -->
  <circle cx="106" cy="68" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
</svg>
