services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitpulse-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DUCKDB_PATH=/app/data/omnipulse.duckdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - gitpulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gitpulse-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1/github
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gitpulse-net

networks:
  gitpulse-net:
    driver: bridge
